name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-community/text-to-speech@5 --legacy-peer-deps

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cat > www/tts-native.js <<'EOF'
          (function(){
            var C=window.Capacitor;
            var native=false;
            try{native=!!(C&&C.isNativePlatform&&C.isNativePlatform())}catch(e){}
            if(!native&&!/; wv\)/.test(navigator.userAgent))return;
            var TTS=null;
            try{TTS=(C&&C.Plugins&&C.Plugins.TextToSpeech)||(C&&C.registerPlugin&&C.registerPlugin("TextToSpeech"))}catch(e){}
            var gen=0,langP=null,audio=null,shown=false;
            function msg(t){
              if(shown||!document.body)return;shown=true;
              var d=document.createElement("div");
              d.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#fff3cd;color:#000;padding:10px;font-size:13px;z-index:99999;direction:ltr";
              d.textContent=t+" | plugin:"+(TTS?"yes":"no");d.onclick=function(){d.remove()};
              document.body.appendChild(d);
            }
            function getLang(){
              if(!TTS)return Promise.resolve(null);
              if(!langP)langP=TTS.getSupportedLanguages().then(function(r){
                var l=(r&&r.languages)||[];
                return l.filter(function(x){return x==="ar-EG"})[0]||l.filter(function(x){return /^ar/i.test(x)})[0]||null;
              }).catch(function(){return "ar-SA"});
              return langP;
            }
            function nativeSpeak(u){
              if(!TTS)return Promise.reject(new Error("tts plugin missing"));
              return getLang().then(function(L){
                if(!L)throw new Error("no arabic voice on device");
                var t0=Date.now();
                return TTS.speak({text:u.text,lang:L,rate:u.rate,pitch:u.pitch,volume:u.volume,category:"ambient"}).then(function(){
                  if(Date.now()-t0<250&&u.text.trim().length>2)throw new Error("native speech silent");
                });
              });
            }
            function chunks(t){
              var out=[],s=t;
              while(s.length>180){var i=s.lastIndexOf(" ",180);if(i<50)i=180;out.push(s.slice(0,i));s=s.slice(i)}
              out.push(s);return out;
            }
            function onlineSpeak(u,my){
              var p=Promise.resolve();
              chunks(u.text.trim()).forEach(function(part){
                p=p.then(function(){
                  if(my!==gen)return;
                  return new Promise(function(res,rej){
                    var a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q="+encodeURIComponent(part));
                    audio=a;
                    a.playbackRate=Math.min(1,Math.max(.7,u.rate+.2));
                    a.onended=res;
                    a.onerror=function(){rej(new Error("online speech failed"))};
                    a.play().catch(rej);
                  });
                });
              });
              return p;
            }
            function U(t){this.text=t;this.lang="ar-SA";this.rate=1;this.pitch=1;this.volume=1;this.voice=null;this.onend=null;this.onerror=null}
            window.SpeechSynthesisUtterance=U;
            var fake={name:"Arabic (device)",lang:"ar-SA",voiceURI:"native-ar",localService:true,default:true};
            Object.defineProperty(window,"speechSynthesis",{configurable:true,value:{
              paused:false,
              getVoices:function(){return [fake]},
              addEventListener:function(){},
              resume:function(){},
              cancel:function(){
                gen++;
                if(TTS){try{TTS.stop().catch(function(){})}catch(e){}}
                if(audio){try{audio.pause()}catch(e){}audio=null}
              },
              speak:function(u){
                var my=gen;
                if(!u.text||!u.text.trim()||u.volume===0){if(u.onend)u.onend();return}
                nativeSpeak(u).catch(function(e1){
                  if(my!==gen)return;
                  return onlineSpeak(u,my).catch(function(e2){
                    if(my===gen)msg("Speech failed: "+(e1&&e1.message||e1)+" | "+(e2&&e2.message||e2));
                    throw e2;
                  });
                }).then(function(){
                  if(my===gen&&u.onend)u.onend();
                },function(){
                  if(my===gen&&u.onerror)u.onerror();
                });
              }
            }});
          })();
          EOF
          sed -i 's#<head>#<head><script src="tts-native.js"></script>#' www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Allow microphone
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Set version number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Get signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download keystore --pattern release.keystore --repo ${{ github.repository }} || true
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -keystore release.keystore -alias takallam -keyalg RSA -keysize 2048 -validity 36500 -storepass takallam123 -keypass takallam123 -dname "CN=Takallam"
            gh release create keystore release.keystore --title "keystore" --notes "signing key" --prerelease --repo ${{ github.repository }}
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with permanent key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks release.keystore --ks-key-alias takallam --ks-pass pass:takallam123 --key-pass pass:takallam123 --out takallam.apk android/app/build/outputs/apk/debug/app-debug.apk
          $APKSIGNER verify takallam.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Takallam-APK
          path: takallam.apk

      - name: Publish release with direct link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo ${{ github.repository }} || true
          gh release create latest takallam.apk --repo ${{ github.repository }} --title "Takallam APK" --notes "Latest build" --latest
